name: Rust

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.85.0, stable]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets and features
        run: cargo check --all-targets --all-features
      - name: Run tests
        run: cargo test --all-targets --all-features
      - name: Run documentation tests
        run: cargo test --doc --all-features
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  no-std:
    name: no_std embedded target
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          targets: thumbv7em-none-eabihf
      - name: Check without std
        run: cargo check --no-default-features --target thumbv7em-none-eabihf
